name: Pip Packages

# Builds pip wheels + sdists for the FPP Rust distributions:
#   - fprime-fpp-lsp     (from fpp_lsp_server)  — executable
#   - fprime-fpp-format  (from fpp_format)      — executable
#   - fprime-fpp-python  (from fpp_python)      — abi3 PyO3 extension (import `fpp_python`)
#
# On push/PR/dispatch this only *builds* the distributions and uploads them as
# artifacts. When a GitHub release is published it additionally publishes every
# package: a normal release goes to PyPI, a GitHub "pre-release" goes to
# TestPyPI. The published version comes from the release tag.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: pip-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheels:
    name: Wheel ${{ matrix.package.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        package:
          - name: fprime-fpp-lsp
            dir: fpp_lsp_server
          - name: fprime-fpp-format
            dir: fpp_format
          - name: fprime-fpp-python
            dir: fpp_python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # On a release, stamp the workspace version from the tag so maturin builds
      # wheels with the released version (strips a leading "v"). Uses perl for
      # portability across the Linux/macOS/Windows runners (BSD sed differs).
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setting workspace version to $VERSION"
          VERSION="$VERSION" perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/' Cargo.toml
          # Pin every internal path dependency (which carries a `version = "=0.0.0"`
          # placeholder) to the exact released version. Without this, the workspace
          # version bump above leaves crates depending on the nonexistent =0.0.0.
          git ls-files '*Cargo.toml' | while IFS= read -r manifest; do
            VERSION="$VERSION" perl -pi -e 's/version = "=0\.0\.0"/version = "=$ENV{VERSION}"/g' "$manifest"
          done
          grep -rn '^version = \|version = "=' Cargo.toml */Cargo.toml

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          working-directory: ${{ matrix.package.dir }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package.name }}-${{ matrix.os }}
          path: ${{ matrix.package.dir }}/dist/*

  sdist:
    name: sdist ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: fprime-fpp-lsp
            dir: fpp_lsp_server
          - name: fprime-fpp-format
            dir: fpp_format
          - name: fprime-fpp-python
            dir: fpp_python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Setting workspace version to $VERSION"
          VERSION="$VERSION" perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/' Cargo.toml
          # Pin every internal path dependency (which carries a `version = "=0.0.0"`
          # placeholder) to the exact released version. Without this, the workspace
          # version bump above leaves crates depending on the nonexistent =0.0.0.
          git ls-files '*Cargo.toml' | while IFS= read -r manifest; do
            VERSION="$VERSION" perl -pi -e 's/version = "=0\.0\.0"/version = "=$ENV{VERSION}"/g' "$manifest"
          done
          grep -rn '^version = \|version = "=' Cargo.toml */Cargo.toml

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ matrix.package.dir }}

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/dist/*

  # Publish both packages on a GitHub release. A pre-release goes to TestPyPI;
  # a normal release goes to PyPI. The built distributions are also attached to
  # the GitHub release as assets.
  publish:
    name: Publish ${{ matrix.package.name }}
    if: github.event_name == 'release'
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: fprime-fpp-lsp
          - name: fprime-fpp-format
          - name: fprime-fpp-python
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "*${{ matrix.package.name }}*"
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Attach distributions to GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does not check out the repo, so `gh` cannot infer the target
          # repository from a local .git dir; point it at the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

      - name: Publish to TestPyPI (pre-release)
        if: github.event.release.prerelease == true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

      - name: Publish to PyPI (release)
        if: github.event.release.prerelease == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
