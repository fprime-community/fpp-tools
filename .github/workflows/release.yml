name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        # Pinned to the Swatinem/rust-cache v2.9.2 release commit.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-bin: false

      - name: Inject version from tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Releasing version: $tag_version"
          # Replace the 0.0.0 placeholder under [workspace.package] with the tag version.
          sed -i 's/^version = "0\.0\.0"$/version = "'"$tag_version"'"/' Cargo.toml
          # Pin every internal path dependency (which carries a `version = "=0.0.0"`
          # placeholder) to the exact tag version so the published crates depend on
          # this release rather than a floating version.
          find . -name Cargo.toml -not -path './target/*' \
            -exec sed -i 's/version = "=0\.0\.0"/version = "='"$tag_version"'"/g' {} +
          # Fail if the workspace version placeholder was not found / not replaced.
          workspace_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "fpp") | .version')
          if [ "$workspace_version" != "$tag_version" ]; then
            echo "::error::Failed to inject workspace version. Expected $tag_version but Cargo.toml resolves to $workspace_version. Is the 0.0.0 placeholder still present?"
            exit 1
          fi
          # Fail if any internal dependency requirement is still pinned to =0.0.0.
          stale=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].dependencies[] | select(.req == "=0.0.0") | .name' | sort -u)
          if [ -n "$stale" ]; then
            echo "::error::These internal dependencies still resolve to '=0.0.0': $stale. Is the =0.0.0 placeholder still present?"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Publish crates to crates.io
        # Publish in dependency (topological) order so each crate's internal
        # dependencies are already available in the index. cargo waits for each
        # published crate to appear in the index before continuing.
        #
        # --allow-dirty: the injected version is an uncommitted working-tree change.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Ordered by the internal dependency graph: a crate only appears after
          # every workspace crate it depends on.
          crates=(
            fpp_util
            fpp_core
            fpp_macros
            fpp_lexer
            fpp_ast
            fpp_fs
            fpp_errors
            fpp_lsp_parser
            fpp_parser
            fpp_format
            fpp_query
            fpp_analysis
            fpp
            fpp_diagram
            fpp_lsp_server
          )

          # Drift guard: fail fast if a publishable workspace member is missing
          # from (or stale in) the ordered list above. Without this, a newly
          # added crate surfaces only as an unresolvable dependency mid-publish.
          expected=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | .name' | sort)
          listed=$(printf '%s\n' "${crates[@]}" | sort)
          if [ "$expected" != "$listed" ]; then
            echo "::error::release.yml crate list is out of sync with the workspace."
            echo "Only in workspace: $(comm -23 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            echo "Only in list:      $(comm -13 <(echo "$expected") <(echo "$listed") | tr '\n' ' ')"
            exit 1
          fi

          # True if $crate@$version already exists on the crates.io index.
          # Makes the loop idempotent so a re-run after a partial failure
          # (e.g. the new-crate rate limit) skips what already published.
          # crates.io rejects requests without a User-Agent (HTTP 403), so one
          # is required here or the check would always report "not published".
          already_published() {
            local crate="$1"
            curl -sf -A "fpp-tools-release-ci (https://github.com/fprime-community/fpp-tools)" \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null 2>&1
          }

          for crate in "${crates[@]}"; do
            echo "::group::Publishing $crate v$version"
            if already_published "$crate"; then
              echo "$crate v$version already on crates.io; skipping."
              echo "::endgroup::"
              continue
            fi
            # Retry ONLY to ride out crates.io's new-crate rate limit (HTTP 429).
            # crates.io allows a burst of ~5 brand-new crate names, then refills
            # one token roughly every 10 minutes; a fresh workspace publishing
            # many new crates trips this. Any other failure (e.g. an unresolved
            # dependency) is permanent, so fail fast rather than retry for ~90min.
            # This retry is only a concern on the very first release (new crate
            # names); later releases publish new versions and aren't rate-limited.
            attempt=1
            max_attempts=8
            while true; do
              if cargo publish -p "$crate" --allow-dirty 2>&1 | tee /tmp/publish.log; then
                break
              fi
              if already_published "$crate"; then
                echo "$crate v$version appeared on crates.io after the attempt; continuing."
                break
              fi
              if ! grep -qiE '429|too many requests|rate limit' /tmp/publish.log; then
                echo "::error::publish of $crate v$version failed for a non-rate-limit reason (see log above); not retrying."
                exit 1
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to publish $crate v$version after $max_attempts rate-limited attempts."
                exit 1
              fi
              echo "::warning::$crate hit the crates.io new-crate rate limit (attempt $attempt/$max_attempts); waiting 11min for a token to refill before retry."
              sleep 660
              attempt=$((attempt + 1))
            done
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        # Do NOT use an action that regenerates notes unconditionally: if the
        # release already exists (e.g. created from the GitHub UI, which also
        # creates the tag that triggers this workflow), generate_release_notes
        # *appends* a second copy of the changelog to the existing body
        # (softprops/action-gh-release#827). Generate notes only when creating a
        # brand-new release so the changelog is written exactly once.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its notes untouched."
          else
            gh release create "$tag" --generate-notes --verify-tag
          fi
