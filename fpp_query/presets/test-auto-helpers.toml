# Upstream `fpp-filenames -u -a`: the unit-test base classes, plus the
# auto-generated test helpers.
# Module templates are expanded, so a component an expansion contributes gets
# these files too.
expand = ["templates"]

[[group]]
node = "DefComponent"
generate = [
    "GTestBase.hpp",
    "GTestBase.cpp",
    "TesterBase.hpp",
    "TesterBase.cpp",
    "TesterHelpers.cpp",
]
