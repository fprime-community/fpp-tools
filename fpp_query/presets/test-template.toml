# Upstream `fpp-filenames -u -t`: the unit-test template. The helpers belong here
# because upstream emits them when `-a` is *off*.
# Module templates are expanded, so a component an expansion contributes gets
# these files too.
expand = ["templates"]

[[group]]
node = "DefComponent"
generate = ["Tester.hpp", "Tester.cpp", "TestMain.cpp", "TesterHelpers.cpp"]
